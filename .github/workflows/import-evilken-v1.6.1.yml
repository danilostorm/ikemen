name: Importar Evil Ken v1.6.1

on:
  push:
    branches:
      - storm-boss-pack-v1.6.1
    paths:
      - '.github/workflows/import-evilken-v1.6.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout da branch Boss Pack
        uses: actions/checkout@v4
        with:
          ref: storm-boss-pack-v1.6.1
          fetch-depth: 0

      - name: Baixar payload do Evil Ken
        shell: bash
        env:
          SMALL_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-b860-820e-9838-90dad3c166b5/raw?se=2026-08-10T14%3A44%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=5d7586f4-9142-5192-91a2-70423476bd3c&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-10T12%3A34%3A23Z&ske=2026-08-11T12%3A34%3A23Z&sks=b&skv=2026-02-06&sig=CuAVI1zaQIRGjpvKQJQAMccaIwyrs8PW412/P3B2LEQ%3D'
          SFF_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-9110-820e-87d2-56dab71a7b3d/raw?se=2026-08-10T14%3A42%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=b8c5c968-6882-5acb-adf8-eb5bb21bf6f5&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-10T11%3A04%3A02Z&ske=2026-08-11T11%3A04%3A02Z&sks=b&skv=2026-02-06&sig=AThsf6LHHvqz6SfiCN9TYQHqvYFQZAf7uY1piZuX%2Bp4%3D'
          SND_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-c8c0-81fd-aea3-d17ee8d18d2f/raw?se=2026-08-10T14%3A42%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=975a260b-850f-59c9-a0de-5cd6b0f163cc&skoid=33096a49-a96b-4506-9fc4-04a7517f8175&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-10T10%3A46%3A30Z&ske=2026-08-11T10%3A46%3A30Z&sks=b&skv=2026-02-06&sig=EbStj93Ml0R3AeumhNONjZgNVgd34jW2/a3zXpaaLjM%3D'
        run: |
          set -euo pipefail
          rm -rf /tmp/evilken-import
          mkdir -p /tmp/evilken-import
          curl -L --fail --retry 5 --retry-all-errors "$SMALL_URL" -o /tmp/evilken-import/small.zip
          unzip -tq /tmp/evilken-import/small.zip
          unzip -q /tmp/evilken-import/small.zip -d /tmp/evilken-import/payload
          rm -rf chars/EvilKenSSF2Plus
          mv /tmp/evilken-import/payload/EvilKenSSF2Plus chars/EvilKenSSF2Plus
          cp data/common1.cns chars/EvilKenSSF2Plus/common1.cns
          curl -L --fail --retry 5 --retry-all-errors "$SFF_URL" -o chars/EvilKenSSF2Plus/EvilKenSSF2Plus.sff
          curl -L --fail --retry 5 --retry-all-errors "$SND_URL" -o chars/EvilKenSSF2Plus/EvilKenSSF2Plus.snd

      - name: Registrar Evil Ken no select.def
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('data/select.def')
          text = p.read_text(encoding='utf-8')
          if 'EvilKenSSF2Plus,' in text:
              print('Evil Ken já registrado; mantendo entrada atual.')
          else:
              lines = text.splitlines()
              row5 = next(i for i, line in enumerate(lines) if line.strip() == '; Row 5')
              honda = next(i for i in range(row5, len(lines)) if lines[i].lstrip().startswith('SFZ_Honda,'))
              slot = next(i for i in range(honda + 1, len(lines)) if lines[i].strip() == 'EMPTY')
              lines[slot] = 'EvilKenSSF2Plus, stages/Ken3.def, includestage = 0, order = 4, ordersurvival = 0'
              p.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='')
          PY

      - name: Validar integração estática
        shell: bash
        run: |
          set -euo pipefail
          test -f chars/EvilKenSSF2Plus/EvilKenSSF2Plus.def
          test -f chars/EvilKenSSF2Plus/EvilKenSSF2Plus.cmd
          test -f chars/EvilKenSSF2Plus/EvilKenSSF2Plus.cns
          test -f chars/EvilKenSSF2Plus/EvilKenSSF2Plus.air
          test -f chars/EvilKenSSF2Plus/EvilKenSSF2Plus.sff
          test -f chars/EvilKenSSF2Plus/EvilKenSSF2Plus.snd
          test -f chars/EvilKenSSF2Plus/pal01.act
          test -f chars/EvilKenSSF2Plus/common1.cns
          test $(stat -c%s chars/EvilKenSSF2Plus/EvilKenSSF2Plus.sff) -gt 8000000
          test $(stat -c%s chars/EvilKenSSF2Plus/EvilKenSSF2Plus.snd) -gt 7000000
          grep -q 'name = "Evil Ken"' chars/EvilKenSSF2Plus/EvilKenSSF2Plus.def
          grep -q 'sprite = EvilKenSSF2Plus.sff' chars/EvilKenSSF2Plus/EvilKenSSF2Plus.def
          grep -q '^EvilKenSSF2Plus, stages/Ken3.def' data/select.def
          grep -q 'main.t_randomChars' external/script/main.lua
          grep -q 'external.script.infinitewatch' external/script/main.lua
          sha256sum chars/EvilKenSSF2Plus/* > /tmp/evilken-sha256.txt
          cat /tmp/evilken-sha256.txt

      - name: Registrar importação na branch
        shell: bash
        run: |
          set -euo pipefail
          cat > IMPORT_EVILKEN_v1.6.1_OK.txt <<'EOF'
          Evil Ken importado para a branch storm-boss-pack-v1.6.1.
          Identidade: Evil Ken
          Roster: order 4 / ordersurvival 0
          Infinite Watch: não alterado
          Bridge: não alterado
          Stage associado: stages/Ken3.def
          Storyboards Arcade: desativados
          Paleta ativa: pal01.act
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chars/EvilKenSSF2Plus data/select.def IMPORT_EVILKEN_v1.6.1_OK.txt
          git commit -m 'Adiciona Evil Ken ao Boss Pack v1.6.1'
          git push origin HEAD:storm-boss-pack-v1.6.1
