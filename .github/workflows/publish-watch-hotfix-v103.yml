name: Publicar Watch Infinito v1.0.3

on:
  push:
    paths:
      - '.github/workflows/publish-watch-hotfix-v103.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Baixar repositório completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Instalar ferramentas
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 zip rsync

      - name: Aplicar correção
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/watch-infinito-hotfix-v103.patch
          git apply .github/watch-infinito-hotfix-v103.patch
          luac5.4 -p external/script/main.lua
          luac5.4 -p external/script/global.lua
          luac5.4 -p external/script/infinitewatch.lua

      - name: Salvar correção na main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add external/script/main.lua external/script/global.lua external/script/infinitewatch.lua
          git commit -m 'Corrige transição entre lutas no Watch Infinito'
          git push origin HEAD:main

      - name: Criar hotfix pequeno
        shell: bash
        run: |
          set -euo pipefail
          hotfix='/tmp/Watch_Infinito_Hotfix_v1.0.3'
          rm -rf "$hotfix"
          mkdir -p "$hotfix/external/script"
          cp external/script/main.lua "$hotfix/external/script/"
          cp external/script/global.lua "$hotfix/external/script/"
          cp external/script/infinitewatch.lua "$hotfix/external/script/"
          cat > "$hotfix/LEIA-ME.txt" <<'EOF'
          WATCH INFINITO HOTFIX v1.0.3

          1. Feche o jogo.
          2. Extraia este ZIP dentro da pasta do jogo.
          3. Confirme a substituição dos arquivos em external/script/.
          4. Abra Street Fighter AZ.exe e escolha WATCH INFINITO.

          Correções:
          - remove o erro de carregamento do módulo infinitewatch;
          - encerra corretamente a tela após o fim da luta;
          - inicia automaticamente a próxima luta;
          - ESC retorna ao menu.
          EOF
          cd /tmp
          zip -qr Watch_Infinito_Hotfix_v1.0.3.zip Watch_Infinito_Hotfix_v1.0.3
          sha256sum Watch_Infinito_Hotfix_v1.0.3.zip > Watch_Infinito_Hotfix_v1.0.3.zip.sha256

      - name: Criar pacote completo
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull
          root='/tmp/full-build'
          folder="$root/Street_Fighter_Alpha_Zero_Watch_Infinito_v1.0.3"
          rm -rf "$root"
          mkdir -p "$folder"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "$GITHUB_WORKSPACE/" "$folder/"
          cd "$root"
          zip -qr -0 /tmp/Street_Fighter_Alpha_Zero_Watch_Infinito_v1.0.3.zip Street_Fighter_Alpha_Zero_Watch_Infinito_v1.0.3
          sha256sum /tmp/Street_Fighter_Alpha_Zero_Watch_Infinito_v1.0.3.zip > /tmp/Street_Fighter_Alpha_Zero_Watch_Infinito_v1.0.3.zip.sha256

      - name: Publicar Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v1.0.3-storm'
          target=$(git rev-parse HEAD)
          cat > /tmp/release-notes.md <<'EOF'
          # Street Fighter Alpha Zero — Watch Infinito v1.0.3

          Corrige o travamento após o fim da luta e o erro:

          `loop or previous error loading module 'external.script.infinitewatch'`

          O WATCH INFINITO agora encerra a tela final, escolhe novos personagens e uma nova fase e inicia a próxima luta automaticamente. Pressione `Esc` para voltar ao menu.

          Para atualizar a v1.0.2 sem baixar tudo novamente, use o arquivo `Watch_Infinito_Hotfix_v1.0.3.zip`.
          EOF
          gh release delete "$tag" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$tag" \
            /tmp/Watch_Infinito_Hotfix_v1.0.3.zip \
            /tmp/Watch_Infinito_Hotfix_v1.0.3.zip.sha256 \
            /tmp/Street_Fighter_Alpha_Zero_Watch_Infinito_v1.0.3.zip \
            /tmp/Street_Fighter_Alpha_Zero_Watch_Infinito_v1.0.3.zip.sha256 \
            --target "$target" \
            --title 'Street Fighter Alpha Zero — Watch Infinito v1.0.3' \
            --notes-file /tmp/release-notes.md
