name: Publicar versão completa corrigida

on:
  push:
    paths:
      - '.github/workflows/publish-full-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar partes da montagem corrigida
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sfaz-parts

          ids=(
            '1curBaZ8e7pdZxexTWsEItcsXrGPZP0Dv'
            '1PPMWPRJ1gTdK3vDrQby1M31kq2b5sbms'
            '17mPT1vxsIsmYMbZqTWZrYXejLEAKXTjk'
            '1OSVR7tFimjmtzpgWsDhIM65u-PWI-X4j'
            '1_nF-MEnATiONGRB_h1HczVklmHB3phJw'
            '13iRGpINn8TP8CRkL6lFXqb6ySlM-akEy'
            '1kxqWFEZnpDfU8lGY2MBQ5jfnQbXQBpAn'
            '12MMmao_TkSP7y4xUdWusdutbHWmgHeAs'
            '1QberBV5hwKvQF5qWOS939OuBWva6XPIm'
            '1x8JohMYKFhigCYG4uZ3djje-QCXy8qF1'
            '103vGfOcJHDpWn3jqjtt2OjEB0PXO7wml'
            '11Qi8oamY8PtdlEn2uRVoo1-9V6vKv4pN'
            '1c6FbK6UjdeOUgJx578XyH1L40q2339dK'
          )

          sizes=(
            83886080 83886080 83886080 83886080 83886080
            83886080 83886080 83886080 83886080 83886080
            83886080 83886080 25458201
          )

          for index in "${!ids[@]}"; do
            output=$(printf '/tmp/sfaz-parts/sfaz_complete.zip.part%02d' "$index")
            curl --location --fail --retry 5 --retry-all-errors \
              --user-agent 'Mozilla/5.0' \
              "https://drive.usercontent.google.com/download?id=${ids[$index]}&export=download&confirm=t" \
              --output "$output"

            actual=$(stat --format='%s' "$output")
            expected=${sizes[$index]}
            if [ "$actual" -ne "$expected" ]; then
              echo "Tamanho incorreto na parte $index: esperado $expected, recebido $actual"
              exit 1
            fi
          done

      - name: Montar e validar ZIP
        shell: bash
        run: |
          set -euo pipefail
          archive='/tmp/Street_Fighter_Alpha_Zero_COMPLETO_CORRIGIDO.zip'
          cat /tmp/sfaz-parts/sfaz_complete.zip.part* > "$archive"
          echo '5e6dc87587b60165e4d666700e46318fc8ce5917cf5bd1b8b8f75ad1d37f7274  /tmp/Street_Fighter_Alpha_Zero_COMPLETO_CORRIGIDO.zip' | sha256sum --check
          unzip -tq "$archive"
          printf '%s  %s\n' \
            '5e6dc87587b60165e4d666700e46318fc8ce5917cf5bd1b8b8f75ad1d37f7274' \
            'Street_Fighter_Alpha_Zero_COMPLETO_CORRIGIDO.zip' \
            > /tmp/Street_Fighter_Alpha_Zero_COMPLETO_CORRIGIDO.zip.sha256

      - name: Colocar montagem completa no repositório
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sfaz-unpacked
          mkdir -p /tmp/sfaz-unpacked
          unzip -q /tmp/Street_Fighter_Alpha_Zero_COMPLETO_CORRIGIDO.zip -d /tmp/sfaz-unpacked

          source_dir='/tmp/sfaz-unpacked/Ikemen_SFAZ_COMPLETO'
          test -f "$source_dir/Street Fighter AZ.exe"
          test -f "$source_dir/data/common.snd"
          test -f "$source_dir/external/script/main.lua"
          test -f "$source_dir/VALIDACAO.json"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            "$source_dir/" "$GITHUB_WORKSPACE/"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git lfs install --local
          git lfs track 'data/common.snd'
          git add .gitattributes
          git add -A

          if git diff --cached --quiet; then
            echo 'A montagem corrigida já está versionada.'
          else
            git commit -m 'Corrige montagem com executável personalizado'
            git push origin HEAD:main
          fi

      - name: Criar Release corrigida
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v1.0.1-storm'
          target=$(git rev-parse HEAD)

          cat > /tmp/release-notes.md <<'EOF_NOTES'
          # Street Fighter Alpha Zero completo — correção do `inDialogue`

          Esta versão reúne os dois pacotes originais fornecidos:

          - personagens, fases e músicas;
          - executável personalizado, dados, scripts, fontes, rotas Arcade e configurações.

          A versão anterior usava o `Ikemen_GO.exe` padrão, que não reconhece o gatilho `inDialogue` utilizado pelos personagens. Esta versão usa o executável correto `Street Fighter AZ.exe`.

          Para jogar, extraia o ZIP e execute `INICIAR_JOGO.bat` ou `Street Fighter AZ.exe`.

          Inclui 45 personagens selecionáveis, 131 fases e correção da música ausente na fase `_Boss-Mike`.

          SHA-256: `5e6dc87587b60165e4d666700e46318fc8ce5917cf5bd1b8b8f75ad1d37f7274`
          EOF_NOTES

          gh release delete 'v1.0.0-storm' --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release delete "$tag" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$tag" \
            /tmp/Street_Fighter_Alpha_Zero_COMPLETO_CORRIGIDO.zip \
            /tmp/Street_Fighter_Alpha_Zero_COMPLETO_CORRIGIDO.zip.sha256 \
            --target "$target" \
            --title 'Street Fighter Alpha Zero completo v1.0.1-storm' \
            --notes-file /tmp/release-notes.md
