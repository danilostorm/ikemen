name: Publicar MUGEN STORM v1.5.0

on:
  push:
    paths:
      - '.github/workflows/publicar-v1.5.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar identidade e documentação
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('data/system.def')
          t=p.read_text(encoding='utf-8')
          t=t.replace('name = "Street Fighter Alpha Zero"','name = "MUGEN STORM - Infinite Battle Arena"',1)
          t=t.replace('menu.itemname.watch = "WATCH INFINITO"','menu.itemname.watch = "STORM LIVE HARD"')
          t=t.replace('title.watch.text = "Watch Infinito"','title.watch.text = "MUGEN STORM - CPU vs CPU"')
          p.write_text(t,encoding='utf-8',newline='')
          PY
          cat > MUGEN_STORM.bat <<'EOF'
          @echo off
          cd /d "%~dp0"
          title MUGEN STORM - Infinite Battle Arena
          echo Iniciando MUGEN STORM - Infinite Battle Arena...
          "Street Fighter AZ.exe"
          EOF
          mkdir -p docs
          cat > LEIA-ME-MUGEN-STORM.txt <<'EOF'
          MUGEN STORM - Infinite Battle Arena v1.5.0
          ==============================================

          Atualização focada em live CPU vs CPU.

          NOVIDADES
          - Identidade: MUGEN STORM - Infinite Battle Arena.
          - WATCH INFINITO passa a aparecer como STORM LIVE HARD.
          - IA máxima (AILevel 8) mantida para os dois lados.
          - Dan recebeu IA STORM dedicada: defesa, anti-air, zoning, pressão, combo cancel e uso de super.
          - C. Viper recebeu IA STORM dedicada: defesa, anti-air, Seismic Hammer, Thunder Knuckle, Burning Kick, pressão e super.
          - Sean recebeu IA STORM dedicada: defesa, anti-air, Tackle, Tornado e uso inteligente dos supers conforme o modo ativo.
          - Fases agora usam shuffle-bag: percorre melhor o pool antes de repetir.
          - Matchup que causar erro Lua recuperável é bloqueado pelo resto da sessão.
          - Elenco continua usando shuffle-bag para reduzir repetição de personagens.

          AUDITORIA
          A auditoria não saiu alterando todo personagem. A maioria dos 45 lutadores Alpha/Zero já possui IA própria. Makoto tem uma camada detalhada em m-2.cns e foi preservada. Os convidados Hyper DBZ também já possuem IA avançada baseada em AILevel e foram preservados.

          INSTALAÇÃO
          1. Feche o jogo.
          2. Extraia o ZIP na pasta principal da versão atual.
          3. Confirme a substituição.
          4. Abra MUGEN_STORM.bat ou Street Fighter AZ.exe.
          5. Entre em STORM LIVE HARD.
          6. ESC continua voltando ao menu.

          ROLLBACK
          Os CMD anteriores de Dan, C. Viper e Sean estão em backup_v1.4.

          IMPORTANTE
          Validação estática e sintaxe Lua foram verificadas. O teste visual/runtime final precisa ser feito no Windows com o executável personalizado.
          EOF
          cat > docs/AUDITORIA_IA_STORM.md <<'EOF'
          # Auditoria de IA - MUGEN STORM v1.5.0

          ## Objetivo
          Melhorar lutas CPU vs CPU sem substituir IAs boas dos autores nem criar leitura perfeita artificial.

          ## Conclusões
          - O motor trabalha com AILevel 1 a 8; STORM LIVE HARD mantém 8 fixo.
          - A maior parte do roster Alpha/Zero já possui IA própria e leitura do adversário.
          - Dan foi o principal outlier Alpha/Zero: camada automática muito mais limitada, baseada principalmente no antigo var(59).
          - C. Viper não apresentava camada dedicada baseada em AILevel/CPU no CMD auditado.
          - Sean tinha golpes completos, mas não uma camada de decisão de CPU comparável aos chars mais fortes.
          - Makoto parecia fraca olhando apenas o CMD, porém sua IA está em m-2.cns: distância, HitDefAttr, defesa, corrida, confirms e cancels. Foi preservada.
          - Hyper DBZ já possui rotinas avançadas de defesa, anti-air, distância, power e chance escalada por AILevel. Foi preservado.

          ## Reforços
          ### Dan
          Defesa, Koryuken anti-air, Gadoken em distância, Dankukyaku de aproximação/cancel, normais por alcance e supers em punish.

          ### C. Viper
          Defesa, Thunder Knuckle anti-air/pressão, Seismic Hammer por distância, Burning Kick em confirm e Emergency Combination em punish.

          ### Sean
          Defesa, Dragon Smash anti-air, Tackle/Tornado por alcance e supers respeitando var(58) e o custo de power.

          ## Live 24/7
          - Shuffle-bag de personagens.
          - Shuffle-bag de fases.
          - Evita repetição imediata quando possível.
          - Blacklist temporária de matchups com erro Lua recuperável.
          - IA 8 aplicada depois da seleção.
          - ESC encerra o modo automático.
          EOF

      - name: Montar pacote incremental
        shell: bash
        run: |
          set -euo pipefail
          PKG=/tmp/MUGEN_STORM_v1.5.0_IA_LIVE_HARD
          rm -rf "$PKG"
          mkdir -p "$PKG/chars/SFZ_Dan" "$PKG/chars/C.Viper" "$PKG/chars/Sean" "$PKG/external/script" "$PKG/data" "$PKG/docs"
          mkdir -p "$PKG/backup_v1.4/chars/SFZ_Dan" "$PKG/backup_v1.4/chars/C.Viper" "$PKG/backup_v1.4/chars/Sean"
          cp external/script/infinitewatch.lua "$PKG/external/script/infinitewatch.lua"
          cp data/system.def "$PKG/data/system.def"
          cp MUGEN_STORM.bat LEIA-ME-MUGEN-STORM.txt "$PKG/"
          cp docs/AUDITORIA_IA_STORM.md "$PKG/docs/"
          python3 <<'PY'
          from pathlib import Path
          import base64,gzip
          root=Path('.github/v1.5_payload')
          pkg=Path('/tmp/MUGEN_STORM_v1.5.0_IA_LIVE_HARD')
          files={
            'dan_patched.b64':'chars/SFZ_Dan/SFZ_Dan.cmd',
            'viper_patched.b64':'chars/C.Viper/C.Viper.cmd',
            'sean_patched.b64':'chars/Sean/sean.cmd',
            'dan_original.b64':'backup_v1.4/chars/SFZ_Dan/SFZ_Dan.cmd',
            'viper_original.b64':'backup_v1.4/chars/C.Viper/C.Viper.cmd',
            'sean_original.b64':'backup_v1.4/chars/Sean/sean.cmd',
          }
          for src,dst in files.items():
              raw=gzip.decompress(base64.b64decode((root/src).read_text().strip()))
              p=pkg/dst; p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(raw)
          PY

      - name: Validar
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4 >/dev/null
          luac -p external/script/infinitewatch.lua
          PKG=/tmp/MUGEN_STORM_v1.5.0_IA_LIVE_HARD
          grep -q 'MUGEN STORM - Infinite Battle Arena' "$PKG/data/system.def"
          grep -q 'STORM LIVE HARD' "$PKG/data/system.def"
          for f in "$PKG/chars/SFZ_Dan/SFZ_Dan.cmd" "$PKG/chars/C.Viper/C.Viper.cmd" "$PKG/chars/Sean/sean.cmd"; do
            grep -a -q 'STORM LIVE HARD AI v1.5.0' "$f"
          done
          grep -q 'f_refillStageBag' "$PKG/external/script/infinitewatch.lua"
          grep -q 'badPairs' "$PKG/external/script/infinitewatch.lua"

      - name: Registrar identidade no repositório
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/system.def MUGEN_STORM.bat LEIA-ME-MUGEN-STORM.txt docs/AUDITORIA_IA_STORM.md
          if ! git diff --cached --quiet; then
            git commit -m 'Cria MUGEN STORM e documenta IA LIVE HARD'
            git push origin HEAD:main
          fi

      - name: Criar ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/MUGEN_STORM_v1.5.0_IA_LIVE_HARD
          zip -r -9 /tmp/MUGEN_STORM_v1.5.0_IA_LIVE_HARD.zip . >/dev/null
          cd /tmp
          unzip -tq MUGEN_STORM_v1.5.0_IA_LIVE_HARD.zip
          sha256sum MUGEN_STORM_v1.5.0_IA_LIVE_HARD.zip > MUGEN_STORM_v1.5.0_IA_LIVE_HARD.zip.sha256

      - name: Publicar Release em português
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v1.5.0-storm --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.5.0-storm \
            /tmp/MUGEN_STORM_v1.5.0_IA_LIVE_HARD.zip \
            /tmp/MUGEN_STORM_v1.5.0_IA_LIVE_HARD.zip.sha256 \
            --title 'MUGEN STORM v1.5.0 - IA LIVE HARD' \
            --notes 'Atualização incremental para a instalação atual. Nova identidade MUGEN STORM - Infinite Battle Arena e modo STORM LIVE HARD. IA 8 fixa, rotação melhor de personagens e fases, proteção contra matchups com erro e reforços dedicados de IA para Dan, C. Viper e Sean após auditoria. IAs boas dos autores foram preservadas. Extraia por cima da pasta atual. ESC continua voltando ao menu.'

      - name: Confirmar Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=$(gh release view v1.5.0-storm --json assets --jq '.assets[].name')
          echo "$ASSETS" | grep -Fx 'MUGEN_STORM_v1.5.0_IA_LIVE_HARD.zip'
          echo "$ASSETS" | grep -Fx 'MUGEN_STORM_v1.5.0_IA_LIVE_HARD.zip.sha256'
          cat > /tmp/release-ok.txt <<'EOF'
          Release v1.5.0-storm validada.
          Nome: MUGEN STORM - Infinite Battle Arena
          Modo: STORM LIVE HARD
          IA: AILevel 8 + reforço dedicado em Dan, C. Viper e Sean
          ZIP: MUGEN_STORM_v1.5.0_IA_LIVE_HARD.zip
          SHA256: MUGEN_STORM_v1.5.0_IA_LIVE_HARD.zip.sha256
          Publicação direta em Releases, sem armazenamento de artifact.
          EOF
          B64=$(base64 -w0 /tmp/release-ok.txt)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/RELEASE_v1.5.0_OK.txt" \
            -f message='Valida Release v1.5.0-storm' -f content="$B64" -f branch='main' >/dev/null
