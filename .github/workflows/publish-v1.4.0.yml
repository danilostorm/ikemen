name: Publish v1.4.0 Hyper DBZ Guests

on:
  push:
    paths:
      - '.github/workflows/publish-v1.4.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current SFAZ repository
        uses: actions/checkout@v4

      - name: Download official Hyper DBZ 6.0c source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hdbz-src
          curl -L --fail --retry 5 --retry-all-errors \
            -o /tmp/HyperDBZWickedAmbition.zip \
            'https://network.mugenguild.com/balthazar/HDBZ/HyperDBZWickedAmbition.zip'
          test $(stat -c%s /tmp/HyperDBZWickedAmbition.zip) -gt 1000000000
          unzip -q /tmp/HyperDBZWickedAmbition.zip -d /tmp/hdbz-src
          rm -f /tmp/HyperDBZWickedAmbition.zip

      - name: Build v1.4.0 guest patch
        shell: bash
        run: |
          set -euo pipefail
          PKG=/tmp/SFAZ_Live_HyperDBZ_Guests_v1.4.0
          rm -rf "$PKG"
          mkdir -p "$PKG"/chars/{GokuZ2,VegetaZ2,PiccoloZ2,FreezaZ2}/{files,states}
          mkdir -p "$PKG"/stages "$PKG"/sound/stages "$PKG"/data

          python3 <<'PY'
          from pathlib import Path
          import shutil

          src = Path('/tmp/hdbz-src')
          pkg = Path('/tmp/SFAZ_Live_HyperDBZ_Guests_v1.4.0')

          def find_dir(name):
              hits = [p for p in src.rglob(name) if p.is_dir() and p.name.lower() == name.lower()]
              if not hits:
                  raise SystemExit(f'Missing directory: {name}')
              hits.sort(key=lambda p: ('chars' not in [x.lower() for x in p.parts], len(p.parts)))
              return hits[0]

          def find_file(root, names):
              if isinstance(names, str): names = [names]
              for name in names:
                  hits = [p for p in root.rglob('*') if p.is_file() and p.name.lower() == name.lower()]
                  if hits:
                      return hits[0]
              raise SystemExit(f'Missing file in {root}: {names}')

          def copy(root, names, dest):
              p = find_file(root, names)
              dest = pkg / dest
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(p, dest)
              print(f'{p} -> {dest}')

          common = find_file(src, 'common1.cns')

          chars = {
              'GokuZ2': {
                  'files': {
                      'goku.sff':['goku.sff'], 'goku.air':['goku.air'],
                      'goku-jap-en-bl.snd':['goku-jap-en-bl.snd'],
                      'goku.cmd':['goku.mfg','goku.cmd'],
                  },
                  'states': ['constants.cns','system.cns','helpers.cns','state-2-3.cns','override.cns','normals.cns','specials.cns','supers.cns'],
                  'config': ['config.txt'],
              },
              'VegetaZ2': {
                  'files': {
                      'armor_vegeta.sff':['armor_vegeta.sff'], 'vegeta.air':['vegeta.air'],
                      'vegeta.snd':['vegeta.snd'], 'vegeta.cmd':['vegeta.mfg','vegeta.cmd'],
                  },
                  'states': ['v_constants.cns','system.cns','helpers.cns','state-2-3.cns','override.cns','normals.cns','specials.cns','supers.cns'],
                  'config': ['v_config.txt'],
              },
              'PiccoloZ2': {
                  'files': {
                      'sprite.sff':['sprite.sff'], 'animation.air':['animation.air'],
                      'sound.snd':['sound.snd'], 'command.cmd':['command.mfg','command.cmd'],
                  },
                  'states': ['constants.cns','system.cns','helpers.cns','state-2-3.cns','override.cns','normals.cns','specials.cns','supers.cns'],
                  'config': ['config.txt'],
              },
              'FreezaZ2': {
                  'files': {
                      'freeza.sff':['freeza.sff'], 'freeza.air':['freeza.air'],
                      'freeza.snd':['freeza.snd'], 'freeza.cmd':['freeza.mfg','freeza.cmd'],
                  },
                  'states': ['constants.cns','system.cns','helpers.cns','state-2-3.cns','override.cns','normals.cns','specials.cns','supers.cns'],
                  'config': ['config.txt'],
              },
          }

          for char, spec in chars.items():
              root = find_dir(char)
              for outname, source_names in spec['files'].items():
                  copy(root, source_names, f'chars/{char}/files/{outname}')
              for state in spec['states']:
                  copy(root, state, f'chars/{char}/states/{state}')
              for cfg in spec['config']:
                  copy(root, cfg, f'chars/{char}/{cfg}')
              shutil.copy2(common, pkg / f'chars/{char}/states/common1.cns')

          stage_names = [
              'hdbz_3rd-makai','hdbz_hangar','hdbz_lookout2','hdbz_namekdying',
              'hdbz_tenka','hdbz_kamehouse','hdbz_space','hdbz_city'
          ]
          for name in stage_names:
              copy(src, f'{name}.def', f'stages/{name}.def')
              copy(src, f'{name}.sff', f'stages/{name}.sff')

          music = [
              'hdbz_3rd-makai.mp3','hdbz_hangar.mp3','hdbz_lookout2.mp3','hdbz_namek2.mp3',
              'hdbz_tenka.mp3','hdbz_kamehouse.mp3','hdbz_space.mp3','hdbz_city_alt.mp3'
          ]
          for name in music:
              copy(src, name, f'sound/stages/{name}')
          PY

          cat > "$PKG/chars/GokuZ2/GokuZ2.def" <<'EOF'
          [Info]
          name = "Goku Z2"
          displayname = "Goku"
          versiondate = 12,25,2020
          mugenversion = 1.0
          author = "Team Z2"
          pal.defaults = 1

          [Files]
          sprite = files\goku.sff
          anim = files\goku.air
          sound = files\goku-jap-en-bl.snd
          cmd = files\goku.cmd
          cns = states\constants.cns
          stcommon = states\common1.cns
          st = states\system.cns
          st2 = states\helpers.cns
          st3 = states\state-2-3.cns
          st4 = states\override.cns
          st5 = states\normals.cns
          st6 = states\specials.cns
          st7 = states\supers.cns
          st8 = config.txt

          [Arcade]
          ; ending storyboard disabled for SFAZ CPU vs CPU guest integration
          EOF

          cat > "$PKG/chars/VegetaZ2/Normal_VegetaZ2.def" <<'EOF'
          [Info]
          name = "Normal Vegeta Z2"
          displayname = "Vegeta"
          versiondate = 09,23,2017
          mugenversion = 1.0
          author = "Team Z2"
          pal.defaults = 1,2,5

          [Files]
          sprite = files\armor_vegeta.sff
          anim = files\vegeta.air
          sound = files\vegeta.snd
          cmd = files\vegeta.cmd
          cns = states\v_constants.cns
          stcommon = states\common1.cns
          st = states\system.cns
          st2 = states\helpers.cns
          st3 = states\state-2-3.cns
          st4 = states\override.cns
          st5 = v_config.txt
          st6 = states\normals.cns
          st7 = states\specials.cns
          st8 = states\supers.cns

          [Arcade]
          ; ending storyboard disabled for SFAZ CPU vs CPU guest integration
          EOF

          cat > "$PKG/chars/PiccoloZ2/PiccoloZ2.def" <<'EOF'
          [Info]
          name = "Piccolo Z2"
          displayname = "Piccolo"
          versiondate = 07,14,2013
          mugenversion = 1.0
          author = "Team Z2"
          pal.defaults = 1,2,3,4,5,6,7
          localcoord = 320,240

          [Files]
          sprite = files/sprite.sff
          anim = files/animation.air
          sound = files/sound.snd
          cmd = files/command.cmd
          cns = states/constants.cns
          st = states/normals.cns
          st2 = states/system.cns
          st3 = states/helpers.cns
          st4 = states/state-2-3.cns
          st5 = states/override.cns
          st6 = states/specials.cns
          st7 = states/supers.cns
          st8 = config.txt
          stcommon = states\common1.cns

          [Arcade]
          ; ending storyboard disabled for SFAZ CPU vs CPU guest integration
          EOF

          cat > "$PKG/chars/FreezaZ2/FreezaZ2.def" <<'EOF'
          [Info]
          name = "Freeza Z2"
          displayname = "Freeza"
          versiondate = 03,22,2017
          mugenversion = 1.0
          author = "Team Z2"
          pal.defaults = 1,2,3,4,6,7
          localcoord = 320,240

          [Files]
          sprite = files\freeza.sff
          anim = files\freeza.air
          sound = files\freeza.snd
          cmd = files\freeza.cmd
          cns = states\constants.cns
          stcommon = states\common1.cns
          st = states\normals.cns
          st2 = states\system.cns
          st3 = states\helpers.cns
          st4 = states\state-2-3.cns
          st5 = states\override.cns
          st6 = states\specials.cns
          st7 = config.txt
          st8 = states\supers.cns

          [Arcade]
          ; ending storyboard disabled for SFAZ CPU vs CPU guest integration
          EOF

          python3 <<'PY'
          from pathlib import Path
          pkg = Path('/tmp/SFAZ_Live_HyperDBZ_Guests_v1.4.0')
          music = {
              'hdbz_3rd-makai':'hdbz_3rd-makai.mp3',
              'hdbz_hangar':'hdbz_hangar.mp3',
              'hdbz_lookout2':'hdbz_lookout2.mp3',
              'hdbz_namekdying':'hdbz_namek2.mp3',
              'hdbz_tenka':'hdbz_tenka.mp3',
              'hdbz_kamehouse':'hdbz_kamehouse.mp3',
              'hdbz_space':'hdbz_space.mp3',
              'hdbz_city':'hdbz_city_alt.mp3',
          }
          import re
          for stem, mp3 in music.items():
              p = pkg / 'stages' / f'{stem}.def'
              text = p.read_text(errors='replace')
              text = re.sub(r'(?im)^\s*bgmusic\s*=.*$', f'bgmusic = sound/stages/{mp3}', text)
              text = re.sub(r'(?im)^\s*spr\s*=.*$', f'spr = stages/{stem}.sff', text)
              p.write_text(text, newline='')
          PY

          cp data/select.def "$PKG/data/select.v1.3.0-backup.def"
          python3 <<'PY'
          from pathlib import Path
          p = Path('/tmp/SFAZ_Live_HyperDBZ_Guests_v1.4.0/data/select.v1.3.0-backup.def')
          lines = p.read_text(errors='replace').splitlines()
          honda = next(i for i,l in enumerate(lines) if l.lstrip().startswith('SFZ_Honda,'))
          empties=[]
          for i in range(honda+1, min(honda+12, len(lines))):
              if lines[i].strip() == 'EMPTY':
                  empties.append(i)
                  if len(empties) == 5: break
          if len(empties) < 5:
              raise SystemExit('Could not locate Row 5 empty slots')
          guests = [
              'GokuZ2, stages/hdbz_3rd-makai.def, includestage = 0, order = 3, ordersurvival = 2',
              'VegetaZ2/Normal_VegetaZ2.def, stages/hdbz_hangar.def, includestage = 0, order = 3, ordersurvival = 2',
              'PiccoloZ2, stages/hdbz_lookout2.def, includestage = 0, order = 3, ordersurvival = 2',
              'FreezaZ2, stages/hdbz_namekdying.def, includestage = 0, order = 4, ordersurvival = 2',
          ]
          for idx,val in zip(empties[:4], guests): lines[idx]=val
          extra = next(i for i,l in enumerate(lines) if l.strip().lower() == '[extrastages]')
          stages = [
              '; Hyper DBZ guest stage pack',
              'stages/hdbz_3rd-makai.def','stages/hdbz_hangar.def','stages/hdbz_lookout2.def',
              'stages/hdbz_namekdying.def','stages/hdbz_tenka.def','stages/hdbz_kamehouse.def',
              'stages/hdbz_space.def','stages/hdbz_city.def'
          ]
          lines[extra+1:extra+1] = stages
          out = Path('/tmp/SFAZ_Live_HyperDBZ_Guests_v1.4.0/data/select.def')
          out.write_text('\n'.join(lines)+'\n')
          PY

          cat > "$PKG/README_HYPERDBZ_GUESTS.txt" <<'EOF'
          SFAZ Live CPU vs CPU - Hyper DBZ Guest Pack v1.4.0
          ====================================================

          Instalar sobre a versão v1.3.0 que já está funcionando.
          Extraia este ZIP na pasta principal do jogo e confirme a substituição de data/select.def.

          Convidados adicionados:
          - Goku Z2
          - Normal Vegeta Z2
          - Piccolo Z2
          - Freeza Z2

          Fases adicionadas:
          - hdbz_3rd-makai
          - hdbz_hangar
          - hdbz_lookout2
          - hdbz_namekdying
          - hdbz_tenka
          - hdbz_kamehouse
          - hdbz_space
          - hdbz_city

          Integração:
          - O WATCH INFINITO não foi alterado.
          - Os convidados entram no shuffle-bag e usam AILevel 8 definido pelo modo Live.
          - common1.cns do Hyper DBZ fica isolado dentro de cada convidado.
          - Arquivos .mfg de comando são copiados como .cmd sem alterar o conteúdo.
          - Storyboards de ending não são necessários para CPU vs CPU.
          - Namek Dying usa sound/stages/hdbz_namek2.mp3.
          - Tenka usa sound/stages/hdbz_tenka.mp3.

          Rollback:
          - data/select.v1.3.0-backup.def contém a seleção anterior.

          Fonte dos convidados/fases: Hyper DBZ oficial, Team Z2, versão 6.0c.
          EOF

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          PKG=/tmp/SFAZ_Live_HyperDBZ_Guests_v1.4.0
          python3 <<'PY'
          from pathlib import Path
          import json, re
          pkg = Path('/tmp/SFAZ_Live_HyperDBZ_Guests_v1.4.0')
          errors=[]
          chars={
              'GokuZ2': pkg/'chars/GokuZ2/GokuZ2.def',
              'VegetaZ2': pkg/'chars/VegetaZ2/Normal_VegetaZ2.def',
              'PiccoloZ2': pkg/'chars/PiccoloZ2/PiccoloZ2.def',
              'FreezaZ2': pkg/'chars/FreezaZ2/FreezaZ2.def',
          }
          report={'errors':errors,'characters':{}}
          for name,defp in chars.items():
              base=defp.parent
              sec=False; refs=[]
              for raw in defp.read_text(errors='replace').splitlines():
                  line=raw.split(';',1)[0].strip()
                  if line.lower()=='[files]': sec=True; continue
                  if sec and line.startswith('['): break
                  if sec and '=' in line:
                      k,v=[x.strip() for x in line.split('=',1)]
                      if k.lower() in {'sprite','anim','sound','cmd','cns','stcommon'} or re.fullmatch(r'st\d*',k.lower()):
                          rel=v.replace('\\','/')
                          ok=(base/rel).exists()
                          refs.append([k,rel,ok])
                          if not ok: errors.append(f'{name}: missing {rel}')
              report['characters'][name]=refs
          for defp in (pkg/'stages').glob('*.def'):
              text=defp.read_text(errors='replace')
              for key in ('spr','bgmusic'):
                  m=re.search(rf'(?im)^\s*{key}\s*=\s*([^;\r\n]+)',text)
                  if m:
                      rel=m.group(1).strip().replace('\\','/')
                      if not (pkg/rel).exists(): errors.append(f'{defp.name}: missing {rel}')
          report['status']='OK' if not errors else 'ERROR'
          (pkg/'VALIDACAO_HYPERDBZ.json').write_text(json.dumps(report,indent=2,ensure_ascii=False))
          if errors:
              print('\n'.join(errors)); raise SystemExit(1)
          print('Static validation OK')
          PY

      - name: Create ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/SFAZ_Live_HyperDBZ_Guests_v1.4.0
          zip -r -9 /tmp/SFAZ_Live_HyperDBZ_Guests_v1.4.0.zip . >/dev/null
          cd /tmp
          unzip -tq SFAZ_Live_HyperDBZ_Guests_v1.4.0.zip
          sha256sum SFAZ_Live_HyperDBZ_Guests_v1.4.0.zip > SFAZ_Live_HyperDBZ_Guests_v1.4.0.zip.sha256
          ls -lh SFAZ_Live_HyperDBZ_Guests_v1.4.0.zip*

      - name: Publish GitHub Release directly (no Actions artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v1.4.0-storm --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.4.0-storm \
            /tmp/SFAZ_Live_HyperDBZ_Guests_v1.4.0.zip \
            /tmp/SFAZ_Live_HyperDBZ_Guests_v1.4.0.zip.sha256 \
            --title 'SFAZ Live CPU vs CPU v1.4.0 - Hyper DBZ Guests' \
            --notes 'Guest expansion for the existing v1.3.0 install. Adds Goku Z2, Normal Vegeta Z2, Piccolo Z2 and Freeza Z2 plus 8 Hyper DBZ stages and stage music. WATCH INFINITO / CPU 8 remains unchanged. Extract over the v1.3.0 game folder. Assets sourced from the official free Hyper DBZ 6.0c distribution by Team Z2.'

      - name: Write release verification marker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=$(gh release view v1.4.0-storm --json assets --jq '.assets[].name')
          echo "$ASSETS" | grep -Fx 'SFAZ_Live_HyperDBZ_Guests_v1.4.0.zip'
          echo "$ASSETS" | grep -Fx 'SFAZ_Live_HyperDBZ_Guests_v1.4.0.zip.sha256'
          cat > /tmp/release-ok.txt <<'EOF'
          Release v1.4.0-storm validada.
          ZIP: SFAZ_Live_HyperDBZ_Guests_v1.4.0.zip
          SHA256: SFAZ_Live_HyperDBZ_Guests_v1.4.0.zip.sha256
          Build: Hyper DBZ official 6.0c source, published directly to Releases without upload-artifact.
          EOF
          B64=$(base64 -w0 /tmp/release-ok.txt)
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/RELEASE_v1.4.0_OK.txt" \
            -f message='Valida Release v1.4.0-storm' \
            -f content="$B64" \
            -f branch='main' >/dev/null
